name: Probe import sources
on:
  push:
    branches: [gh-pages]
    paths: ['tools/probe3.sh','.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages }
      - run: mkdir -p desk/data && bash tools/probe3.sh > desk/data/probe3.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name "commander-desk-bot"; git config user.email "actions@users.noreply.github.com"
          git add desk/data && git commit -m "Probe results [skip ci]" && (git pull -q --rebase origin gh-pages; git push) || echo "nothing"
